<!DOCTYPE html>  
<html lang="en">  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width, initial-scale=1.0">  
<title id="pageTitle">Product Page | V-Best Interiors</title>  
<meta id="ogTitle" property="og:title" content="V-Best Interiors">  
<meta id="ogDescription" property="og:description" content="Luxury furniture, delivered.">  
<meta id="ogImage" property="og:image" content="">  
<meta id="ogUrl" property="og:url" content="">

<style>  
body { margin:0; font-family:sans-serif; background:#f5f5f5; }  
.top-cart-bar {  
  position: fixed; top:0; left:0; width:100%; z-index:9999;  
  background:#222; color:#fff; display:flex; justify-content:center;  
  align-items:center; padding:10px 20px; box-shadow:0 2px 5px rgba(0,0,0,0.1);  
}  
.top-cart-bar span, .top-cart-bar a { font-weight:bold; color:#fff; font-size:1.1rem; text-decoration:none; display:inline-flex; align-items:center; gap:6px; }  
.cart-badge { background:#FF3300; color:#fff; border-radius:50%; padding:2px 6px; font-size:0.8rem; display:inline-block; }  
.product-page { padding:80px 20px 40px; max-width:1200px; margin:0 auto; }
.product-main { display:flex; gap:20px; flex-wrap:wrap; }
.product-left img { width:100%; max-width:500px; border-radius:8px; }
.product-left .thumbs { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; max-width:500px; }
.product-left .thumbs img { width:64px; height:64px; object-fit:cover; border-radius:6px; border:2px solid transparent; cursor:pointer; }
.product-left .thumbs img.active { border-color:#000; }
.product-right { flex:1; min-width:280px; }
.product-right h1 { margin:0 0 10px; color:#222; font-size:1.8rem; }
.product-right .fs-price-row { display:flex; align-items:center; gap:12px; margin-bottom:12px; flex-wrap:wrap; }
.product-right .fs-price { font-weight:bold; font-size:1.3rem; }
.product-right .fs-old { text-decoration:line-through; color:#888; }
.fs-views { font-size:0.95rem; color:#555; display:flex; align-items:center; gap:6px; margin-bottom:10px; }
.fs-views b { font-weight:bold; }
.fs-dot { width:10px; height:10px; border-radius:50%; background:#25D366; animation:pulse 1.2s infinite; }
@keyframes pulse { 0%{transform:scale(0.8);opacity:0.7;}50%{transform:scale(1.2);opacity:1;}100%{transform:scale(0.8);opacity:0.7;} }

.product-right .fs-btns { display:flex; gap:10px; margin-bottom:15px; flex-wrap:wrap; }
.fs-btn { padding:10px; border-radius:6px; font-weight:bold; cursor:pointer; text-align:center; flex:1; text-decoration:none; display:inline-block; box-sizing:border-box; }
.fs-btn.add { background:#000; color:#fff; border:none; }
.fs-btn.inquiry { background:#25D366; color:#fff; border:none; }

.product-desc { margin-bottom:20px; }
.product-desc h3 { margin:14px 0 6px; }
.product-desc p { margin:0 0 8px; line-height:1.55; }
.color-row { margin-bottom:12px; }
.color-label { font-weight:bold; display:block; margin-bottom:8px; }
.color-opts { display:flex; flex-wrap:wrap; gap:8px; }
.color-btn { padding:4px 10px; border:1px solid #ccc; border-radius:16px; background:#fff; color:#222; font-size:0.75rem; cursor:pointer; }
.color-btn.active { background:#000; color:#fff; border-color:#000; }
.color-sel { margin-top:8px; font-weight:bold; min-height:1.2em; }
.color-note { margin-top:4px; font-size:0.8rem; color:#777; }
.qty-row { display:flex; align-items:center; gap:12px; margin-bottom:12px; flex-wrap:wrap; }
.qty-label { font-weight:bold; }
.qty-box { display:inline-flex; align-items:center; border:1px solid #ccc; border-radius:6px; background:#fff; overflow:hidden; }
.qty-btn { width:40px; height:40px; border:none; background:#f0f0f0; font-size:1.3rem; font-weight:bold; cursor:pointer; }
.qty-btn:active { background:#ddd; }
.qty-num { min-width:44px; text-align:center; font-weight:bold; font-size:1.05rem; }
.qty-total { font-weight:bold; color:#222; }
.delivery-box { background:#fff; border-radius:8px; padding:15px; margin-bottom:20px; }
.delivery-box h3 { margin:0 0 10px; }
.delivery-box h4 { margin:12px 0 6px; }
.delivery-box ul { margin:0 0 0 18px; padding:0; line-height:1.55; }
.wa-help { background:#fff; border-radius:8px; padding:15px; margin-bottom:20px; }
.wa-help p { margin:0 0 10px; }
.wa-help a { display:inline-block; background:#25D366; color:#fff; text-decoration:none; font-weight:bold; padding:10px 16px; border-radius:6px; }
.product-reviews { margin-top:20px; background:#fff; padding:15px; border-radius:8px; }
.product-reviews h3 { margin:0 0 10px; }
.review-item { border-top:1px solid #ddd; padding:8px 0; }
.review-item strong { display:block; margin-bottom:4px; }
.review-stars { color:#FFD700; margin-bottom:4px; }

.review-form { margin-top:10px; display:flex; flex-direction:column; gap:8px; }
.review-form input, .review-form textarea, .review-form select { width:100%; padding:8px; border-radius:6px; border:1px solid #ccc; font-size:0.95rem; }
.review-form button { background:#25D366; color:#fff; border:none; padding:10px 14px; border-radius:6px; font-weight:bold; cursor:pointer; font-size:1rem; }

.product-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:15px; margin-top:20px; }
.fs-card { background:#fff; border-radius:8px; padding:10px; display:flex; flex-direction:column; cursor:pointer; transition:0.2s; position:relative; }
.fs-card:hover { box-shadow:0 2px 8px rgba(0,0,0,0.15); }
.fs-thumb img { width:100%; border-radius:6px; }
.fs-body h3 { margin:8px 0; font-size:1rem; color:#222; }
.fs-price-row { display:flex; flex-direction:column; gap:4px; }
.fs-btns-card { display:flex; flex-direction:column; gap:6px; margin-top:6px; }
.fs-btns-card .fs-btn { width:100%; padding:10px; box-sizing:border-box; }

.fs-badge { position:absolute; top:8px; left:8px; padding:2px 6px; font-size:0.7rem; color:#fff; border-radius:4px; }
.fs-orange { background:#FF6600; }
.fs-green { background:#2DB400; }

.site-footer { background:#111; color:#ddd; margin-top:40px; }
.footer-wrap { max-width:1200px; margin:0 auto; padding:40px 20px; display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:25px; }
.site-footer h3,.site-footer h4{ color:#fff; }
.site-footer a{ color:#ccc; text-decoration:none; display:block; margin:6px 0; }
.footer-bottom{ text-align:center; padding:12px; border-top:1px solid #222; font-size:0.85rem; }
@keyframes fsShimmer { 0%{background-position:200% 0;} 100%{background-position:-200% 0;} }
</style>

</head>  
<body>  

<div class="top-cart-bar">  
  <span id="topBannerText">V-Best Luxury Interior</span>  
  <a href="cart.html">🛒 Cart <span id="cart-count" class="cart-badge">0</span></a>  
</div>  

<div class="product-page">  
  <div class="product-main">  
    <div class="product-left" id="productLeft">
      <div style="aspect-ratio:1/1;max-width:500px;border-radius:8px;background:linear-gradient(90deg,#eee 25%,#f5f5f5 50%,#eee 75%);background-size:200% 100%;animation:fsShimmer 1.2s infinite;display:flex;align-items:center;justify-content:center;color:#999;font-size:0.9rem">Loading photo…</div>
    </div>  
    <div class="product-right" id="productRight">
      <div style="height:28px;width:70%;background:#eee;border-radius:4px;margin-bottom:14px"></div>
      <div style="height:20px;width:40%;background:#eee;border-radius:4px;margin-bottom:20px"></div>
      <div style="height:16px;width:90%;background:#eee;border-radius:4px;margin-bottom:8px"></div>
      <div style="height:16px;width:80%;background:#eee;border-radius:4px"></div>
    </div>  
  </div>  

  <div id="similarWrap" style="display:none">
    <h2>More designs like this</h2>
    <div id="similarGrid" class="product-grid"></div>
    <div style="text-align:center;margin:15px 0">
      <button id="viewAllBtn" class="fs-btn add" style="flex:none;padding:10px 28px" onclick="toggleSimilar()">View all</button>
    </div>
  </div>

  <h2>You May Also Like</h2>  
  <div id="relatedGrid" class="product-grid"></div>  

  <h2>Top Trending</h2>  
  <div id="topTrendingGrid" class="product-grid"></div>  

  <h2>Related Products</h2>  
  <div id="relatedTopGrid" class="product-grid"></div>  
</div>  

<footer class="site-footer">  
  <div class="footer-wrap">  
    <div>  
      <h3>V-Best Interiors</h3>  
      <p>Luxury furniture & modern interior solutions.</p>  
    </div>  
    <div>  
      <h4>Contact</h4>  
      <p>📞 +234 708 053 5579</p>  
      <p>✉️ best28763@gmail.com</p>  
    </div>  
    <div>  
      <h4>Support</h4>  
      <a href="https://wa.me/2347080535579" target="_blank">Chat on WhatsApp</a>  
    </div>  
  </div>  
<div class="footer-bottom">© 2023 V-Best Interiors</div>  
</footer>  

<script>  
const sheetUrl = "https://opensheet.elk.sh/1FA4s21Je3ebeFXUXGu_xvqdo4gbM1v9Q9jOHt6LAH6Y/Sheet1";  

function normKey(k){ return String(k||'').toLowerCase().replace(/[^a-z0-9]/g,''); }  
function findField(it, names){ for(const n of names) for(const k in it) if(normKey(k)===normKey(n)) return it[k]; return ''; }  
function renderDesc(raw){
  const parts = String(raw||'').split(/\s*\|\s*|\r?\n+/).map(x=>x.trim()).filter(Boolean);
  let about=[], feats=[], material='', size='', mode='about';
  parts.forEach(t=>{
    if(/^features:?$/i.test(t)){ mode='feat'; return; }
    if(/^features:/i.test(t)){ mode='feat'; t=t.replace(/^features:\s*/i,''); if(!t) return; }
    let m;
    if((m=t.match(/^material:\s*(.*)$/i))){ material=m[1]; mode='other'; return; }
    if((m=t.match(/^size:\s*(.*)$/i))){ size=m[1]; mode='other'; return; }
    if(mode==='feat') feats.push(t.replace(/^\d+[\.\)]\s*/,''));
    else if(mode==='about') about.push(t);
  });
  let h='<h3>Description</h3><p>'+escHtml(about.join(' '))+'</p>';
  if(feats.length) h+='<h3>Features</h3><ul style="margin:0 0 12px 18px;padding:0">'+feats.map(f=>'<li>'+escHtml(f)+'</li>').join('')+'</ul>';
  if(material) h+='<h3>Material</h3><p>'+escHtml(material)+'</p>';
  if(size) h+='<h3>Size</h3><p>'+escHtml(size)+'</p>';
  return h;
}

function renderDelivery(priceNum){
  const high = priceNum >= 1000000;
  const lagos = high
    ? '<b>Lagos:</b> Same-day delivery. Payment is required before delivery.'
    : '<b>Lagos:</b> Same-day delivery. Pay on delivery, after you have received and checked your item.';
  const other = high
    ? '<b>Other cities:</b> Delivery within 2 to 5 working days. Payment is required before delivery.'
    : '<b>Other cities:</b> Delivery within 2 to 5 working days. Full or half payment is required before dispatch.';
  return '<div class="delivery-box"><h3>Delivery Information</h3><ul><li>'+lagos+'</li><li>'+other+'</li></ul>'
    + '<h4>Good to know</h4><ul>'
    + '<li>Delivery fees depend on your location and will be confirmed before dispatch.</li>'
    + '<li>Please inspect your item when it arrives.</li>'
    + '<li>Someone should be available to receive the delivery.</li>'
    + '<li>Colours may look slightly different from the photos, depending on your screen.</li>'
    + '<li>For questions or to confirm your order, message us on WhatsApp.</li>'
    + '</ul></div>';
}

function escHtml(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }  
function escJs(s){ return String(s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'\\"'); }  
function imgList(raw){ return String(raw||'').split(/\s*,\s*|\r?\n+/).map(x=>x.trim()).filter(Boolean); }
const DEFAULT_COLORS = ['Black','White','Grey','Brown','Beige','Gold'];
function colorList(raw){ const l = String(raw||'').split(/\s*,\s*/).map(x=>x.trim()).filter(Boolean); return l.length ? l : DEFAULT_COLORS; }
function isBigProduct(cat, name){ return /\b(sofas?|couch(es)?|sectionals?|beds?|wardrobes?)\b/i.test(String(cat||'')+' '+String(name||'')); }
function safe(u){ return u && String(u).trim() ? String(u).trim() : ''; }  
function absImg(u){ u = safe(u); if(!u) return ''; return /^https?:\/\//i.test(u) ? u : (window.location.origin + '/' + u.replace(/^\/+/, '')); }
function priceToNumber(p){ return Number(String(p||'').replace(/[^\d]/g,'')); }  

// Cart badge  
(function(){  
  const el = document.getElementById('cart-count');  
  const cart = JSON.parse(localStorage.getItem('cart')||'[]');  
  el.style.display='inline-block'; el.textContent=cart.length;  
  window.addEventListener('storage',()=>{   
    const c=JSON.parse(localStorage.getItem('cart')||'[]');   
    el.textContent=c.length; el.style.display='inline-block';   
  });  
})();  

// Random people viewing  
function getRandomViews(){ return Math.floor(Math.random()*4801)+200; }  

(async function(){  
  const res = await fetch(sheetUrl);  
  const data = await res.json();  
  const dataWithIndex = data.map((p,i)=>({ ...p, __row:i }));  

  const params = new URLSearchParams(window.location.search);  

  // ✅ Use id first, fallback to row if no id  
  const productId = params.get('id');  
  const rowNum = parseInt(params.get('row'));  

  let product;  
  if(productId){  
    product = dataWithIndex.find(p => String(findField(p,['id','ID'])) === String(productId));  
  } else if(!isNaN(rowNum)){  
    product = dataWithIndex[rowNum];  
  }  
  if(!product) product = dataWithIndex[0];  

  const viewsCount = getRandomViews();  
  product.Views = viewsCount;  

  const imgs = imgList(findField(product,['ImageLink','Image','imageurl']));
  const rawImg = imgs[0] || '';  
  const hasImage = rawImg && String(rawImg).trim() !== '';  
  const name = findField(product,['ProductName','Product Name','product','name']);  
  const price = findField(product,['DiscountPrice','Discount Price','discount','Price','price']);  
  const oldPrice = findField(product,['Price','price','Amount','amount']);  

  const desc = findField(product,['Description','description','details']);  
  const colors = colorList(findField(product,['Colors','Colours','Color','Colour']));
  const category = String(findField(product,['Category','category'])||'').trim();
  const isBig = isBigProduct(category, name);
  const wa = findField(product,['WhatsApp','WhatsApp Link','whatsapp']) || 'https://wa.me/2347080535579';  

  // Swap the top banner to "Free Delivery" for anything under ₦700,000
  const bannerPrice = priceToNumber(price || oldPrice);
  const bannerEl = document.getElementById('topBannerText');
  if (bannerEl) {
    const isFreeDelivery = bannerPrice && bannerPrice < 700000;
    bannerEl.textContent = isFreeDelivery ? '🚚 FREE DELIVERY' : 'V-Best Luxury Interior';
    bannerEl.style.fontWeight = isFreeDelivery ? '900' : 'bold';
    bannerEl.style.fontSize = isFreeDelivery ? '1.2rem' : '';
    bannerEl.style.color = isFreeDelivery ? '#FFD700' : '';
    bannerEl.style.letterSpacing = isFreeDelivery ? '0.5px' : '';
  }

  // Fill in per-product sharing info (WhatsApp/Facebook preview card).
  // NOTE: set via JavaScript, so a crawler bot that does not run JS (most
  // link-preview bots) may still show a plain preview on a brand-new link.
  const shareTitle = (name || 'V-Best Interiors') + (price ? ' - ' + price : '');
  const shareDesc = (desc || '').replace(/\s*\|\s*/g, ' ').slice(0, 160);
  document.title = shareTitle;
  const elT = document.getElementById('ogTitle'); if (elT) elT.setAttribute('content', shareTitle);
  const elD = document.getElementById('ogDescription'); if (elD) elD.setAttribute('content', shareDesc);
  const elI = document.getElementById('ogImage');
  if (elI && rawImg) {
    const absImg = /^https?:\/\//i.test(rawImg) ? rawImg : (window.location.origin + '/' + String(rawImg).replace(/^\/+/, ''));
    elI.setAttribute('content', absImg);
  }
  const elU = document.getElementById('ogUrl'); if (elU) elU.setAttribute('content', window.location.href);

  // ✅ Out of stock if no image  
  if(!hasImage){  
    document.getElementById('productLeft').innerHTML = `  
      <div style="padding:40px;background:#fff;border-radius:8px;text-align:center">  
        <h2 style="color:#b00020">Out of Stock</h2>  
        <p>This product is currently unavailable.</p>  
      </div>`;  
    document.getElementById('productRight').innerHTML = `  
      <h1>${escHtml(name)}</h1>  
      <p style="color:#b00020;font-weight:600">This item is currently out of stock.</p>`;  
    return;  
  }  

  document.getElementById('productLeft').innerHTML =
    `<img id="mainImg" src="${escHtml(rawImg)}" alt="${escHtml(name)}">` +
    (imgs.length > 1
      ? `<div class="thumbs">` + imgs.map((u,i)=>`<img src="${escHtml(u)}" alt="${escHtml(name)} ${i+1}" class="${i===0?'active':''}" onclick="setMainImg(${i})">`).join('') + `</div>`
      : '');
  window.setMainImg = function(i){
    const m = document.getElementById('mainImg');
    if(m) m.src = imgs[i];
    document.querySelectorAll('.thumbs img').forEach((t,idx)=>t.classList.toggle('active', idx===i));
  };

  document.getElementById('productRight').innerHTML = `  
    <h1>${escHtml(name)}</h1>  
    <div class="fs-price-row">  
      ${oldPrice && oldPrice!=price ? `<div class="fs-old">${escHtml(oldPrice)}</div>`:''}  
      <div class="fs-price">${escHtml(price||oldPrice)}</div>  
    </div>  
    <div class="fs-views"><span class="fs-dot"></span> <b>${viewsCount}</b> people viewing this now</div>  
    ${isBig ? '' : `    <div class="color-row">
      <span class="color-label">Preferred colour:</span>
      <div class="color-opts">${colors.map((c,i)=>`<button type="button" class="color-btn" onclick="pickColor(${i})">${escHtml(c)}</button>`).join('')}</div>
      <div class="color-sel" id="colorSel"></div>
      <div class="color-note">Colour in the photo may differ. We'll confirm availability on WhatsApp.</div>
    </div>`}
    <div class="qty-row">
      <span class="qty-label">Quantity:</span>
      <div class="qty-box">
        <button type="button" class="qty-btn" onclick="changeQty(-1)" aria-label="Decrease quantity">&minus;</button>
        <span class="qty-num" id="qtyNum">1</span>
        <button type="button" class="qty-btn" onclick="changeQty(1)" aria-label="Increase quantity">+</button>
      </div>
      <span class="qty-total" id="qtyTotal"></span>
    </div>
    <div class="fs-btns">  
      <button class="fs-btn add" onclick="addToCart('${escJs(name)}','${escJs(price||oldPrice)}','${escJs(rawImg)}',getQty(),getColor())">🛒 Add to Cart</button>  
      <a class="fs-btn inquiry" id="inquiryBtn" href="${wa}?text=${encodeURIComponent((rawImg?absImg(rawImg)+'\n\n':'')+'Hello, I am interested in ' + name)}" target="_blank">📩 Inquiry</a>  
    </div>  
    <div class="product-desc">${renderDesc(desc)}</div>
    ${renderDelivery(priceToNumber(price||oldPrice))}
    <div class="wa-help">
      <p>Need help? Chat with us on WhatsApp:</p>
      <a href="https://wa.me/2347080535579" target="_blank">💬 07080535579</a>
    </div>
    <div class="product-reviews">  
      <h3>Be the first to review</h3>  
      <div id="reviewsList"></div>  
      <div class="review-form">  
        <input type="text" id="reviewName" placeholder="Your Name">  
        <select id="reviewStars">  
          <option value="5">★★★★★</option>  
          <option value="4">★★★★☆</option>  
          <option value="3">★★★☆☆</option>  
          <option value="2">★★☆☆☆</option>  
          <option value="1">★☆☆☆☆</option>  
        </select>  
        <textarea id="reviewText" placeholder="Write your review here"></textarea>  
        <button onclick="submitReview()">Submit</button>  
      </div>  
    </div>
  `;

let currentQty = 1;
let selectedColor = '';
window.getQty = function(){ return currentQty; };
window.getColor = function(){ return selectedColor; };
function updateInquiry(){
  const inq = document.getElementById('inquiryBtn');
  if(!inq) return;
  const msg = (rawImg ? absImg(rawImg) + '\n\n' : '')
    + 'Hello, I am interested in ' + name
    + (selectedColor ? ' (Colour: ' + selectedColor + ')' : '')
    + (currentQty > 1 ? ' (Quantity: ' + currentQty + ')' : '');
  inq.href = wa + '?text=' + encodeURIComponent(msg);
}
window.changeQty = function(d){
  currentQty = Math.max(1, Math.min(99, currentQty + d));
  const n = document.getElementById('qtyNum');
  if(n) n.textContent = currentQty;
  const unit = priceToNumber(price||oldPrice);
  const t = document.getElementById('qtyTotal');
  if(t) t.textContent = (currentQty > 1 && unit) ? 'Total: \u20A6' + (unit*currentQty).toLocaleString('en-US') : '';
  updateInquiry();
};
window.pickColor = function(i){
  const c = colors[i];
  selectedColor = (selectedColor === c) ? '' : c;
  document.querySelectorAll('.color-btn').forEach((b,idx)=>b.classList.toggle('active', colors[idx] === selectedColor));
  const sel = document.getElementById('colorSel');
  if(sel) sel.textContent = selectedColor ? 'Selected: ' + selectedColor + ' \u2713' : '';
  updateInquiry();
};

window.addToCart = function(name, price, img, qty, color){
const cart = JSON.parse(localStorage.getItem('cart')||'[]');
const item = {name: color ? name + ' (Colour: ' + color + ')' : name, price, image:img, qty: Math.max(1, parseInt(qty)||1)};
if(color) item.color = color;
cart.push(item);
localStorage.setItem('cart', JSON.stringify(cart));
const el = document.getElementById('cart-count');
if(el){ el.textContent=cart.length; el.style.display='inline-block'; }
alert('Added to cart!');
}

window.submitReview = function(){
const name = document.getElementById('reviewName').value.trim() || 'Anonymous';
const stars = document.getElementById('reviewStars').value;
const text = document.getElementById('reviewText').value.trim();
if(!text){ alert('Enter review first'); return; }

const list = document.getElementById('reviewsList');  
const div = document.createElement('div');  
div.className='review-item';  
div.innerHTML = `<strong>${escHtml(name)}</strong>  
                 <div class="review-stars">${'★'.repeat(stars)}</div>  
                 <div>${escHtml(text)}</div>  
                 <em>Waiting for admin approval</em>`;  
list.prepend(div);  

document.getElementById('reviewText').value='';  
document.getElementById('reviewName').value='';

}

function shuffleArray(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function renderGrid(list, gridId){
const grid = document.getElementById(gridId);
const filtered = list.filter(p=>{
const pr = findField(p,['DiscountPrice','Discount Price','discount','Price','price']);
return priceToNumber(pr)>=1000;
});
const shuffled = shuffleArray(filtered);
grid.innerHTML = shuffled.slice(0,5).map(p=>{
const img=safe(imgList(findField(p,['ImageLink','Image','imageurl']))[0]);
const name=findField(p,['ProductName','Product Name','product','name']);
const price=findField(p,['DiscountPrice','Discount Price','discount','Price','price']);
const id = findField(p,['id','ID']);
return    `<div class="fs-card" onclick="window.location='product.html?id=${id}'">   
   <span class="fs-thumb"><img src="${escHtml(img)}" alt="${escHtml(name)}"></span>   
   <div class="fs-body">   
   <h3>${escHtml(name)}</h3>   
   <div class="fs-price-row"><div class="fs-price">${escHtml(price)}</div></div>   
   <div class="fs-btns-card">   
   <button class="fs-btn add" onclick="addToCart('${escJs(name)}','${escJs(price)}','${escJs(img)}');event.stopPropagation();">🛒 Add to Cart</button>   
   <a class="fs-btn inquiry" href="${wa}?text=${encodeURIComponent((img?absImg(img)+'\n\n':'')+'Hello, I am interested in ' + name)}" target="_blank">📩 Inquiry</a>   
   </div>   
   </div>   
   </div>`;
}).join('');
}

// ---- More designs like this (same category, up to 6, View all shows the rest)
(function(){
  const myId = String(findField(product,['id','ID']));
  const catKey = category.toLowerCase();
  if(!catKey) return;
  const pool = dataWithIndex.filter(p=>{
    if(String(findField(p,['id','ID'])) === myId) return false;
    if(String(findField(p,['Category','category'])||'').trim().toLowerCase() !== catKey) return false;
    const pn = String(findField(p,['ProductName','Product Name','product','name'])||'').trim();
    const pi = imgList(findField(p,['ImageLink','Image','imageurl']))[0];
    return pn && pi;
  });
  if(!pool.length) return;
  const similar = shuffleArray(pool);
  let showAll = false;
  function draw(){
    const list = showAll ? similar : similar.slice(0,6);
    document.getElementById('similarGrid').innerHTML = list.map(p=>{
      const img = safe(imgList(findField(p,['ImageLink','Image','imageurl']))[0]);
      const nm = findField(p,['ProductName','Product Name','product','name']);
      const pr = findField(p,['DiscountPrice','Discount Price','discount','Price','price']);
      const id = findField(p,['id','ID']);
      return `<div class="fs-card" onclick="window.location='product.html?id=${encodeURIComponent(id)}'">
        <span class="fs-thumb"><img loading="lazy" src="${escHtml(img)}" alt="${escHtml(nm)}"></span>
        <div class="fs-body">
          <h3>${escHtml(nm)}</h3>
          <div class="fs-price-row"><div class="fs-price">${escHtml(pr)}</div></div>
          <div class="fs-btns-card">
            <button class="fs-btn add" onclick="addToCart('${escJs(nm)}','${escJs(pr)}','${escJs(img)}');event.stopPropagation();">🛒 Add to Cart</button>
            <a class="fs-btn inquiry" href="${wa}?text=${encodeURIComponent((img?absImg(img)+'\n\n':'')+'Hello, I am interested in ' + nm)}" target="_blank" onclick="event.stopPropagation();">📩 Inquiry</a>
          </div>
        </div>
      </div>`;
    }).join('');
    const btn = document.getElementById('viewAllBtn');
    btn.style.display = similar.length > 6 ? '' : 'none';
    btn.textContent = showAll ? 'Show less' : 'View all (' + similar.length + ')';
  }
  window.toggleSimilar = function(){ showAll = !showAll; draw(); };
  draw();
  document.getElementById('similarWrap').style.display = '';
})();

renderGrid(dataWithIndex,'relatedGrid');
renderGrid(dataWithIndex,'topTrendingGrid');
renderGrid(dataWithIndex,'relatedTopGrid');

document.getElementById('year').textContent = new Date().getFullYear();

})();
